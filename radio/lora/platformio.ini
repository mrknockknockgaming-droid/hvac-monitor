; LoRa: the frame library (lib/lorafmt, shared with the node and thermostat firmware), its tests,
; and the plug-in gateway for homes that keep their own thermostat. See ../README.md.
;   pio test -e native              frame format + gateway logic vs the Python reference
;   pio run -e gateway_heltec       plug-in gateway (Heltec WiFi LoRa 32 V3, 915 MHz)

[platformio]
default_envs = gateway_heltec

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

[env:native]
platform = native
build_flags = -std=gnu++17 -O1 -DUNITY_INCLUDE_DOUBLE
test_build_src = no

[env:gateway_heltec]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
    jgromes/RadioLib@^7.1.0
