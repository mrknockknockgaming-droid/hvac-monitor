; LoRa range test for two Heltec WiFi LoRa 32 (V3) boards (ESP32-S3 + SX1262, 915 MHz version).
; One runs "sender" (at the condenser or in the attic), one runs "receiver" (where the gateway
; would sit). See ../README.md, "Range test".
;   pio run -e sender -t upload       pio run -e receiver -t upload -t monitor

[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.0
    olikraus/U8g2@^2.35.0

[env:sender]
build_flags = -DROLE_SENDER

[env:receiver]
build_flags = -DROLE_RECEIVER
