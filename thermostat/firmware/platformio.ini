; Fullscope display thermostat firmware (see ../README.md).
; Tests on this PC:      pio test -e native        (needs a host g++, e.g. MSYS2 ucrt64)
; Build for the board:   pio run -e waveshare43
; Flash:                 pio run -e waveshare43 -t upload

[platformio]
default_envs = waveshare43

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; The control logic and its tests, compiled for the PC.
[env:native]
platform = native
build_flags = -std=gnu++17 -O1 -DUNITY_INCLUDE_DOUBLE
test_build_src = no

; Waveshare ESP32-S3-Touch-LCD-4.3 (800 x 480 RGB panel, GT911 touch, CH422G I/O expander,
; ESP32-S3 with 16 MB flash and 8 MB PSRAM).
[env:waveshare43]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH="${PROJECT_INCLUDE_DIR}/lv_conf.h"
    -I include
lib_extra_dirs = ../../radio/lora/lib          ; LoRa gateway (config.h LORA_GATEWAY 1)
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@^7.1.0
    knolleary/PubSubClient@^2.8
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@~8.3.11
