<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fullscope</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#0d1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fullscope">
<link rel="stylesheet" href="fullscope.css">
<script>
  try { var t = localStorage.getItem("fs_theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="root" class="fs"></div>
<button class="btn theme-t fs" type="button" id="theme">Light / dark</button>
<script src="vendor/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
