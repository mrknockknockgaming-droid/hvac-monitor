# Broker for docker-compose.prod.yml. start.sh writes the password file and copies the
# certificates from tls/ into /mosquitto/data/certs before Mosquitto starts.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/data/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Inside the Docker network only (ingest worker, API); not published.
listener 1883

# The nodes, over the internet.
listener 8883
cafile /mosquitto/data/certs/ca.crt
certfile /mosquitto/data/certs/server.crt
keyfile /mosquitto/data/certs/server.key
tls_version tlsv1.2
