; HVAC Monitor firmware — PlatformIO project
; Build/flash:  pio run -e outdoor -t upload   |   pio run -e indoor -t upload

[platformio]
default_envs = outdoor, indoor

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
build_unflags = -std=gnu++11
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

[env:outdoor]
build_flags = -DNODE_OUTDOOR -std=gnu++17
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit SHT31 Library@^2.2.2

[env:indoor]
build_flags = -DNODE_INDOOR -std=gnu++17
lib_deps =
    ${env.lib_deps}
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; Over-the-air updates after the first USB flash (set the password to match OTA_PASS):
[env:outdoor_ota]
extends = env:outdoor
upload_protocol = espota
upload_port = hvac-outdoor.local
upload_flags = --auth=hvac

[env:indoor_ota]
extends = env:indoor
upload_protocol = espota
upload_port = hvac-indoor.local
upload_flags = --auth=hvac
