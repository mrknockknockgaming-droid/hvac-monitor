; HVAC Monitor firmware — PlatformIO project
; Build/flash:  pio run -e outdoor -t upload   |   pio run -e indoor -t upload

[platformio]
default_envs = outdoor, indoor

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; deep, not chain+: chain+ skips WiFiProv's #if-guarded SimpleBLE include
lib_ldf_mode = deep
; Bluetooth setup needs ~830 kB more than the default 1.25 MB app slots: two 1.9 MB slots (OTA kept),
; 128 kB SPIFFS (unused). A board still on the old table needs one USB flash to switch.
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
; USB builds also write <env>-<version>-factory.bin (one file at 0x0) for Fullscope Office's flasher
extra_scripts = post:tools/factory_bin.py
; LoRa (config.h LORA_ENABLED 1): the frame library and radio wrapper shared with the gateway
lib_extra_dirs = ../radio/lora/lib
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    jgromes/RadioLib@^7.1.0
    ; Bluetooth WiFi setup (SETUP button): the core's own libraries, which the finder misses
    WiFiProv
    SimpleBLE

[env:outdoor]
build_flags = -DNODE_OUTDOOR -std=gnu++17
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit SHT31 Library@^2.2.2

[env:indoor]
build_flags = -DNODE_INDOOR -std=gnu++17
lib_deps =
    ${env.lib_deps}
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; Over-the-air updates after the first USB flash (set the password to match OTA_PASS):
[env:outdoor_ota]
extends = env:outdoor
upload_protocol = espota
upload_port = hvac-outdoor.local
upload_flags = --auth=hvac

[env:indoor_ota]
extends = env:indoor
upload_protocol = espota
upload_port = hvac-indoor.local
upload_flags = --auth=hvac

; Rev A boards (no SETUP button) still on the original partition table, flashed over WiFi: the same
; firmware without Bluetooth setup, which keeps it inside the default 1.25 MB app slots. OTA can't
; change the partition table, so these are how a rev A board on the AC gets new firmware without USB.
; pio run -e outdoor_reva_ota -t upload --upload-port <board IP>
[env:outdoor_reva_ota]
extends = env:outdoor_ota
board_build.partitions = default.csv
build_flags = ${env:outdoor.build_flags} -DNO_BLE_SETUP
; the same library finder as the USB builds (deep+ missed RadioLib's SPI), with Bluetooth kept out
lib_ignore = WiFiProv, SimpleBLE, BLE, BluetoothSerial
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    jgromes/RadioLib@^7.1.0
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit SHT31 Library@^2.2.2

[env:indoor_reva_ota]
extends = env:indoor_ota
board_build.partitions = default.csv
build_flags = ${env:indoor.build_flags} -DNO_BLE_SETUP
; the same library finder as the USB builds (deep+ missed RadioLib's SPI), with Bluetooth kept out
lib_ignore = WiFiProv, SimpleBLE, BLE, BluetoothSerial
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    jgromes/RadioLib@^7.1.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
